<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cadastro de Produtos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="atv3.css">
</head>
<body>
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
		<section class="card product-card w-100 p-4 p-sm-5" aria-labelledby="page-title">
			<header class="mb-4">
				<h1 class="h2 mb-2" id="page-title">Cadastro de produtos</h1>
				<p class="intro mb-0">Preencha os dados para adicionar um produto ao catálogo.</p>
			</header>

				<form>
					<div class="mb-3">
						<label class="form-label" for="product-name">Nome do produto</label>
						<input class="form-control" id="product-name" name="productName" type="text" placeholder="Ex.: Fone sem fio" minlength="2" maxlength="120" autocomplete="off" required>
						<div class="invalid-feedback">Informe um nome com pelo menos 2 caracteres.</div>
					</div>

					<div class="mb-3">
						<label class="form-label" for="product-price">Preço</label>
						<div class="input-group">
							<span class="input-group-text" aria-hidden="true">R$</span>
							<input class="form-control" id="product-price" name="price" type="number" min="0.01" step="0.01" placeholder="0,00" inputmode="decimal" required>
							<div class="invalid-feedback">Informe um preço maior que zero.</div>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label" for="product-category">Categoria</label>
						<select class="form-select" id="product-category" name="category" required>
							<option value="" selected disabled>Selecione uma categoria</option>
							<option value="eletronicos">Eletrônicos</option>
							<option value="roupas">Roupas</option>
							<option value="alimentos">Alimentos</option>
							<option value="moveis">Móveis</option>
							<option value="outros">Outros</option>
						</select>
						<div class="invalid-feedback">Selecione uma categoria para continuar.</div>
					</div>

					<div class="mb-4">
						<label class="form-label" for="product-description">Descrição</label>
						<textarea class="form-control" id="product-description" name="description" rows="4" minlength="10" maxlength="1000" placeholder="Descreva as características do produto" required></textarea>
						<div class="invalid-feedback">A descrição deve ter pelo menos 10 caracteres.</div>
					</div>

					<div class="form-actions d-flex flex-column flex-sm-row justify-content-end gap-2">
						<button class="btn btn-outline-secondary px-4" type="reset">Limpar</button>
						<button class="btn btn-primary px-4" type="submit">Cadastrar produto</button>
					</div>
				</form>
		</section>
	</main>
</body>
</html>
