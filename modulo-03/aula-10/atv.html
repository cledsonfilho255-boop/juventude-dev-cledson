<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="atv.css">
</head>
<body>
  <main class="container page-shell">
    <section class="form-panel" aria-labelledby="page-title">
      <div class="panel-accent" aria-hidden="true"></div>
      <div class="panel-content">
        <header>
          <p class="eyebrow">Catálogo / Produtos</p>
          <h1 id="page-title">Cadastro de produtos</h1>
          <p class="intro">Adicione as informações do produto para manter seu catálogo organizado.</p>
        </header>

        <form method="post">
          <div class="form-grid">
            <div class="field-name">
              <label class="form-label" for="product-name">Nome do produto</label>
              <input class="form-control" id="product-name" name="productName" type="text" placeholder="Digite o nome do produto" minlength="2" maxlength="120" autocomplete="off" required>
            </div>

            <div>
              <label class="form-label" for="product-price">Preço</label>
              <input class="form-control" id="product-price" name="price" type="number" min="0.01" step="0.01" placeholder="0,00" inputmode="decimal" required>
            </div>

            <div>
              <label class="form-label" for="product-category">Categoria</label>
              <select class="form-select" id="product-category" name="category" required>
                <option value="" selected disabled>Selecione uma categoria</option>
                <option value="eletronicos">Eletrônicos</option>
                <option value="roupas">Roupas</option>
                <option value="alimentos">Alimentos</option>
                <option value="moveis">Móveis</option>
                <option value="outros">Outros</option>
              </select>
            </div>

            <div class="field-description">
              <label class="form-label" for="product-description">Descrição</label>
              <textarea class="form-control" id="product-description" name="description" rows="4" minlength="10" maxlength="1000" placeholder="Descreva os detalhes do produto" required></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-outline-secondary px-4" type="reset">Limpar</button>
            <button class="btn btn-primary px-4" type="submit">Cadastrar produto</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
