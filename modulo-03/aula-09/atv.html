<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 - Tamanhos</title>
</head>

<body>
    <main class="container py-4">
        <div class="row row-cols-1 row-cols-md-3 g-3">
            <div class="col"><div class="p-3 bg-primary text-white">Coluna 1</div></div>
            <div class="col"><div class="p-3 bg-success text-white">Coluna 2</div></div>
            <div class="col"><div class="p-3 bg-danger text-white">Coluna 3</div></div>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-8 col-md-4">
                <div class="p-3 bg-warning text-center">Coluna centralizada</div>
            </div>
        </div>
    </main>
</body>

</html>
