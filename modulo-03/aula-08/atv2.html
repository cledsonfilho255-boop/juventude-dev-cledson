<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="mb-4 text-center">Cadastro</h1>

                        <form>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Email</label>
                                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                                <div id="emailHelp" class="form-text">Nunca compartilharemos seu email.</div>
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="exampleInputPassword1">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label" for="exampleCheck1">Marque aqui</label>
                            </div>

                            <div class="mb-3">
                                <label for="fruta" class="form-label">Escolha uma fruta</label>
                                <select class="form-select" id="fruta" aria-label="Selecione uma fruta">
                                    <option selected>Selecione...</option>
                                    <option value="1">Maçã</option>
                                    <option value="2">Banana</option>
                                    <option value="3">Laranja</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="customRange3" class="form-label">Nível de preferência</label>
                                <input type="range" class="form-range" min="0" max="5" step="0.5" id="customRange3">
                            </div>

                            <div class="mb-3">
                                <label for="state" class="form-label">Estado</label>
                                <select class="form-select" id="state" required>
                                    <option selected disabled value="">Selecione...</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="BH">Belo Horizonte</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="basic-url" class="form-label">URL personalizada</label>
                                <div class="input-group">
                                    <span class="input-group-text">https://example.com/users/</span>
                                    <input type="text" class="form-control" id="basic-url">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="floatingTextarea" class="form-label">Comentários</label>
                                <textarea class="form-control" id="floatingTextarea" rows="4"></textarea>
                            </div>

                            <div class="mb-3 form-check">
                                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                                <label class="form-check-label" for="invalidCheck">
                                    Concordo com os termos e condições
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
