<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>

    <form actin="/enviar-contato" method="post">
        <input type="email" name="email" placeholder="seu@email.com">
        <br>
        <br>
        <input type="password" name="senha" placeholder="sua senha">
        <br>
        <input type="radio" name="genero" value="f"> Femenino
        <br>
        <input type="radio" name="genero" value="m">Masculino
        <br>
        <input type="radio" name="genero" value="outros">Outros

        <br>

        <input type="file" name="foto_perfil">

        <br>
        <br>
        <select name="assunto">
            <option value="duvida">duvida/option>
            <option value="elogio">elogio</option>
            <option value="reclamaçao">reclamaçao</option>
        </select>
        <br>
        <br>
        <textarea name="messagem rows=" 5" placeholder="escreva sua messagem"></textarea>

        <br>
        <label for="campo-nome">Nome comleto</label>
<br>
        <input type="text" id="campo-nome" nome="nome">
<br>
<br>
        <label for="campo-aceite">Aceito os termos de uso</label>
        <input type="checkbox" id="campo-aceito" name="aceite">
<br>
        <label for="cep">CEP</label>
        <input type="text"
        id="cep"
        name="cep"
           pattern="[0-9]{5}-[0-9]{3}"
           title="FORMATO ESPERADO: OOOOO-OOO">
<br>
<br>
        <label for="telefone">TELEFONE</label>
<br>
        <input type="tel"
        name="telefone"
        id="telefone"placeholder="(00) 00000-0000" required inputmode="tel" pattern=""\(\d{2}\) \d{5}-\d{4}" title="FORMATO ESPERADO: (00) 00000-0000">
<br>
        <input type="text" required>
        <button type='submit'>ENVIAR</button>

</body>

</html>
